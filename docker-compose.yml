# Question Studio local database ONLY — never point at Denedio production/staging.
services:
  question-studio-db:
    image: postgres:16-alpine
    container_name: question-studio-db
    environment:
      POSTGRES_USER: question_studio
      POSTGRES_PASSWORD: question_studio
      POSTGRES_DB: question_studio
    ports:
      - "5433:5432"
    volumes:
      - question_studio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U question_studio -d question_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  question_studio_pgdata:
